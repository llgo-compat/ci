name: Standard Library

on:
  pull_request:
    paths:
      - .github/workflows/std.yml
      - .github/actions/setup-macos-intel-llvm/**
      - scripts/**
  workflow_dispatch:
    inputs:
      llgo_repository:
        description: LLGo repository to test
        required: true
        default: xgo-dev/llgo
        type: string
      llgo_ref:
        description: Branch, tag, or commit to test
        required: true
        default: main
        type: string
  schedule:
    # 04:00 Asia/Shanghai (20:00 UTC on the previous day), daily.
    - cron: "0 20 * * *"

concurrency:
  # Preserve daily/manual reports and stop superseded contribution checks.
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  actions: read

env:
  LLGO_REF: ${{ inputs.llgo_ref || 'main' }}

jobs:
  std-matrix:
    name: STD matrix
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - name: Verify matrix and report coverage regressions
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Generate native matrix
        id: matrix
        run: |
          matrix=$(python3 scripts/compatibility_matrix.py std)
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  native:
    needs: std-matrix
    name: std (${{ matrix.lane }}, ${{ matrix.os }}${{ matrix.windows_abi && format(', {0}', matrix.windows_abi) || '' }}${{ matrix.windows_arch && format(', {0}', matrix.windows_arch) || '' }}, Go ${{ matrix.go_version }}, shard ${{ matrix.shard_index }}/${{ matrix.shard_total }})
    timeout-minutes: ${{ matrix.windows_arch == 'arm64' && 120 || matrix.windows_arch == '386' && 90 || 60 }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.std-matrix.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.llgo_repository || 'xgo-dev/llgo' }}
          ref: ${{ env.LLGO_REF }}
      - name: Check out Intel LLVM setup
        if: matrix.platform == 'darwin/amd64'
        uses: actions/checkout@v7
        with:
          path: compatibility-ci
      - uses: ./compatibility-ci/.github/actions/setup-macos-intel-llvm
        id: intel-llvm
        if: matrix.platform == 'darwin/amd64'
      - name: Install dependencies
        uses: ./.github/actions/setup-deps
        with:
          llvm-version: ${{ matrix.llvm }}
          install-llvm: ${{ matrix.platform != 'darwin/amd64' }}
          windows-abi: ${{ matrix.windows_abi || 'msvc' }}
          windows-arch: ${{ matrix.windows_arch || 'amd64' }}

      - name: Set up Go for build
        uses: ./.github/actions/setup-go
        with:
          architecture: ${{ matrix.host_go_arch || '' }}

      - name: Restore LLGo cache
        uses: ./.github/actions/setup-llgo-cache

      - name: Build LLGo and test tools
        shell: bash
        env:
          GOFLAGS: ${{ steps.intel-llvm.outputs.go-flags || env.GOFLAGS }}
          CGO_CPPFLAGS: ${{ steps.intel-llvm.outputs.cgo-cppflags || env.CGO_CPPFLAGS }}
          CGO_LDFLAGS: ${{ steps.intel-llvm.outputs.cgo-ldflags || env.CGO_LDFLAGS }}
        run: |
          dev/build_ci_tools.sh "$RUNNER_TEMP/llgo-bin"
          echo "$RUNNER_TEMP/llgo-bin" >> "$GITHUB_PATH"
          echo "LLGO_ROOT=$GITHUB_WORKSPACE" >> "$GITHUB_ENV"

      - name: Activate native Windows target
        if: runner.os == 'Windows'
        uses: ./.github/actions/activate-windows-target
        with:
          windows-abi: ${{ matrix.windows_abi }}
          windows-arch: ${{ matrix.windows_arch }}

      - name: Verify native target identity
        shell: bash
        env:
          TARGET_PLATFORM: ${{ matrix.platform }}
        run: |
          target_os=$(go env GOOS)
          if [[ "$RUNNER_OS" == Windows ]]; then
            target_os="windows-${LLGO_WINDOWS_ABI}"
          fi
          actual="$target_os/$(go env GOARCH)"
          if [[ "$actual" != "$TARGET_PLATFORM" ]]; then
            echo "error: target is $actual, expected $TARGET_PLATFORM" >&2
            exit 1
          fi

      - name: Run standard library tests
        env:
          LLGO_BUILD_CACHE: "1"
          LLGO_TEST_BENCH_GO126: "1"
          LLGO_TEST_CHECK_SYMBOLS: ${{ matrix.check_symbols && '1' || '0' }}
          LLGO_TEST_STD_BUILDMODES: ${{ matrix.std_buildmodes && '1' || '0' }}
          LLGO_TEST_SUITE: "std"
          SHARD_INDEX: ${{ matrix.shard_index }}
          SHARD_TOTAL: ${{ matrix.shard_total }}
        shell: bash
        run: |
          set -euo pipefail

          tool_suffix=
          if [[ "$RUNNER_OS" == Windows ]]; then
            tool_suffix=.exe
            export LLGO_STDIO_NOBUF=1
          fi
          export LLGO="$RUNNER_TEMP/llgo-bin/llgo${tool_suffix}"
          export LLGO_TEST_LLGEN="$RUNNER_TEMP/llgo-bin/llgen${tool_suffix}"
          export CHECK_STD_SYMBOLS="$RUNNER_TEMP/llgo-bin/check_std_symbols${tool_suffix}"
          if [[ "${{ matrix.lane }}" == compatibility ]]; then
            run_version() {
              local version=$1
              shift
              local cache_dir="$RUNNER_TEMP/std-version-cache/go${version}"
              mkdir -p "$cache_dir"
              XDG_CACHE_HOME="$cache_dir" dev/test_go_version.sh "$version" "$@"
            }
            failed_versions=()
            for version in 1.20 1.21 1.22 1.23 1.24 1.25 1.26; do
              packages=()
              case "$version" in
                1.20|1.21) packages=(./test/std/bufio ./test/std/bytes ./test/std/encoding/json ./test/std/math/bits) ;;
                1.22) packages=(./test/std/bufio ./test/std/bytes ./test/std/encoding/json ./test/std/go/version) ;;
                1.23) packages=(./test/std/iter ./test/std/maps ./test/std/slices ./test/std/structs ./test/std/unique) ;;
                1.24) packages=(./test/std/bytes ./test/std/crypto/hkdf ./test/std/crypto/pbkdf2 ./test/std/weak) ;;
                1.25) packages=(./test/std/crypto ./test/std/crypto/ecdsa ./test/std/crypto/sha3 ./test/std/go/ast ./test/std/go/token ./test/std/go/types ./test/std/hash ./test/std/hash/maphash ./test/std/io/fs ./test/std/log/slog ./test/std/mime/multipart ./test/std/net/http ./test/std/os ./test/std/reflect ./test/std/runtime/trace ./test/std/sync ./test/std/testing ./test/std/testing/fstest ./test/std/testing/synctest ./test/std/unicode) ;;
                1.26) packages=(./test/std/bytes ./test/std/crypto ./test/std/crypto/ecdh ./test/std/crypto/fips140 ./test/std/crypto/hpke ./test/std/crypto/mlkem ./test/std/crypto/mlkem/mlkemtest ./test/std/crypto/rsa ./test/std/crypto/x509 ./test/std/errors ./test/std/go/ast ./test/std/go/token ./test/std/log/slog ./test/std/net ./test/std/net/http ./test/std/net/netip ./test/std/os ./test/std/reflect ./test/std/testing ./test/std/testing/cryptotest) ;;
              esac
              if ! run_version "$version" "${packages[@]}"; then
                failed_versions+=("$version")
              fi
            done
            if [[ ${#failed_versions[@]} -ne 0 ]]; then
              printf 'versioned standard-library test failures:' >&2
              printf ' Go %s' "${failed_versions[@]}" >&2
              printf '\n' >&2
              exit 1
            fi
          else
            # Pass the std tree explicitly so this external compatibility lane
            # never picks up test/goroot from older LLGo source revisions.
            dev/test_go_version.sh "${{ matrix.go_version }}" ./test/std/...
          fi

      - name: Check std symbol coverage
        if: runner.os == 'Windows' && matrix.windows_arch != 'amd64' && (matrix.shard_total == '1' || matrix.shard_index == '1')
        shell: bash
        run: bash doc/_readme/scripts/check_std_cover.sh

      - name: Summarize native shard
        if: always()
        shell: bash
        env:
          LANE: ${{ matrix.lane }}
          TARGET_PLATFORM: ${{ matrix.platform }}
          GO_VERSION: ${{ matrix.go_version }}
          SHARD_INDEX: ${{ matrix.shard_index }}
          SHARD_TOTAL: ${{ matrix.shard_total }}
          JOB_STATUS: ${{ job.status }}
        run: |
          report_dir="$RUNNER_TEMP/std-native-report"
          mkdir -p "$report_dir"
          platform="$TARGET_PLATFORM"
          report_id="${LANE}-${platform//\//-}-${GO_VERSION}-${SHARD_INDEX}"
          printf '%s\t%s\t%s\t%s\t%s\t%s\n' \
            "$platform" "$LANE" "$GO_VERSION" "$SHARD_INDEX" "$SHARD_TOTAL" "$JOB_STATUS" \
            >"$report_dir/summary-$report_id.tsv"

      - name: Upload native shard summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: std-native-stat-${{ matrix.lane }}-${{ matrix.os }}-${{ matrix.windows_abi || 'none' }}-${{ matrix.windows_arch || 'none' }}-${{ matrix.go_version }}-${{ matrix.shard_index }}
          path: ${{ runner.temp }}/std-native-report
          if-no-files-found: error
          retention-days: 1

  wasm-std:
    name: wasm std acceptance (${{ matrix.profile }}, ${{ matrix.shard }}/${{ matrix.profile == 'W32-WASI' && 5 || 3 }})
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        profile: [J32-GoJS, J32-Emscripten, J64-Emscripten, W32-WASI]
        shard: [0, 1, 2]
        include:
          - profile: W32-WASI
            shard: 3
          - profile: W32-WASI
            shard: 4
    env:
      GOFLAGS: -tags=llvm22
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.llgo_repository || 'xgo-dev/llgo' }}
          ref: ${{ env.LLGO_REF }}
      - uses: ./.github/actions/setup-deps
        with:
          llvm-version: 22
      - uses: emscripten-core/setup-emsdk@v15
        if: ${{ matrix.profile == 'J32-GoJS' || matrix.profile == 'J32-Emscripten' || matrix.profile == 'J64-Emscripten' }}
        with:
          version: '6.0.8'
      - uses: actions/setup-node@v7
        if: ${{ matrix.profile != 'W32-WASI' }}
        with:
          node-version: '24'
      - uses: ./.github/actions/setup-binaryen
      - uses: bytecodealliance/actions/wasmtime/setup@v1
        if: ${{ matrix.profile == 'W32-WASI' }}
        with:
          version: '39.0.1'
      - uses: ./.github/actions/setup-go
      - name: Install Wasmer llgo-v7.5.0.2
        if: ${{ matrix.profile == 'W32-WASI' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          package="$RUNNER_TEMP/wasmer-llgo-v7.5.0.2"
          gh release download llgo-v7.5.0.2 --repo xgo-dev/wasmer \
            --pattern wasmer-linux-amd64.tar.gz --dir "$package"
          (
            cd "$package"
            echo '7878597d48f7e2435b8da1f43e11499fc3073dc0191a6c74c00c27f33849f179  wasmer-linux-amd64.tar.gz' | sha256sum --check
            tar -xzf wasmer-linux-amd64.tar.gz
            test "$(cat REVISION)" = "7692163d5f320ba0d475b2f848f36c1e1bcbdd57"
          )
          chmod +x "$package/bin/wasmer"
          "$package/bin/wasmer" --version -v
          echo "$package/bin" >> "$GITHUB_PATH"
      - name: Record Wasmer revision and backends
        if: ${{ matrix.profile == 'W32-WASI' }}
        run: wasmer --version -v
      - name: Check acceptance accounting
        run: go test ./dev/wasmstdlib -count=1
      - name: Build LLGo
        run: go build -o "$RUNNER_TEMP/llgo" ./cmd/llgo
      - name: Execute every discovered test package in this shard
        env:
          PROFILE: ${{ matrix.profile }}
          SHARD: ${{ matrix.shard }}
          SHARDS: ${{ matrix.profile == 'W32-WASI' && 5 || 3 }}
        run: |
          # Go's Node wrapper reserves only 8 KiB for argv and env. Keep
          # Actions control-plane metadata out of spawned Wasm processes.
          for name in $(compgen -e); do
            case "$name" in
              GITHUB_*|ACTIONS_*) unset "$name" ;;
            esac
          done
          go run ./dev/wasmstdlib -full -profile "$PROFILE" \
            -shard "$SHARD" -shards "$SHARDS" -llgo "$RUNNER_TEMP/llgo" \
            -report "$RUNNER_TEMP/acceptance.json"
      - name: Summarize acceptance shard
        if: always()
        shell: bash
        run: |
          report="${{ runner.temp }}/acceptance.json"
          if [[ -f "$report" ]]; then
            jq -r '
              "### wasm test acceptance (" + .profile + ") · shard " + (.shard|tostring) + "/" + (.shards|tostring) + "\n\n" +
              "| Total | Passed | Not-Applicable | Failed / Unresolved |\n" +
              "|---:|---:|---:|---:|\n" +
              "| " + (.packages | length | tostring) +
              " | " + ([.packages[] | select(.status == "pass")] | length | tostring) +
              " | " + ([.packages[] | select(.status == "not-applicable" or .status == "separate-suite" or .status == "other-shard")] | length | tostring) +
              " | " + ([.packages[] | select(.status != "pass" and .status != "not-applicable" and .status != "separate-suite" and .status != "other-shard")] | length | tostring) +
              " |" +
              (
                [.packages[] | select(.status != "pass" and .status != "not-applicable" and .status != "separate-suite" and .status != "other-shard")] as $failed |
                if ($failed | length) > 0 then
                  "\n\n**Failed packages**\n\n" + ($failed | map("- `" + .package + "`: " + .reason) | join("\n"))
                else
                  ""
                end
              )
            ' "$report" >>"$GITHUB_STEP_SUMMARY"
          fi
      - name: Preserve all results and individual package logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wasm-acceptance-${{ matrix.profile }}-${{ matrix.shard }}
          path: |
            ${{ runner.temp }}/acceptance.json
            ${{ runner.temp }}/acceptance.json.logs/
          if-no-files-found: error

  wasm-browser:
    name: real-browser GoJS callback
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GOFLAGS: -tags=llvm22
      LLGO_BUILD_CACHE: 'on'
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.llgo_repository || 'xgo-dev/llgo' }}
          ref: ${{ env.LLGO_REF }}
      - uses: ./.github/actions/setup-deps
        with:
          llvm-version: 22
      - uses: emscripten-core/setup-emsdk@v15
        with:
          version: '6.0.8'
      - uses: ./.github/actions/setup-go
      - name: Set up Chrome
        id: setup-chrome
        uses: browser-actions/setup-chrome@v2
        with:
          install-dependencies: true
      - name: Require the hosted browser
        env:
          BROWSER_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
        run: |
          test -x "$BROWSER_BIN"
          "$BROWSER_BIN" --version
      - name: Build LLGo
        run: go build -o "$RUNNER_TEMP/llgo" ./cmd/llgo
      - name: Run the GoJS artifact in Chrome
        env:
          BROWSER_BIN: ${{ steps.setup-chrome.outputs.chrome-path }}
          LLGO: ${{ runner.temp }}/llgo
        run: dev/test_wasm_browser.sh

  wasm-sentinels:
    name: wasm GOROOT sentinels
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GOFLAGS: -tags=llvm22
      LLGO_BUILD_CACHE: 'on'
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.llgo_repository || 'xgo-dev/llgo' }}
          ref: ${{ env.LLGO_REF }}
      - uses: ./.github/actions/setup-deps
        with:
          llvm-version: 22
      - uses: emscripten-core/setup-emsdk@v15
        with:
          version: '6.0.8'
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - uses: ./.github/actions/setup-binaryen
      - uses: bytecodealliance/actions/wasmtime/setup@v1
        with:
          version: '39.0.1'
      - uses: ./.github/actions/setup-go
      - name: Install Wasmer llgo-v7.5.0.2
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          package="$RUNNER_TEMP/wasmer-llgo-v7.5.0.2"
          gh release download llgo-v7.5.0.2 --repo xgo-dev/wasmer \
            --pattern wasmer-linux-amd64.tar.gz --dir "$package"
          (
            cd "$package"
            echo '7878597d48f7e2435b8da1f43e11499fc3073dc0191a6c74c00c27f33849f179  wasmer-linux-amd64.tar.gz' | sha256sum --check
            tar -xzf wasmer-linux-amd64.tar.gz
            test "$(cat REVISION)" = "7692163d5f320ba0d475b2f848f36c1e1bcbdd57"
          )
          chmod +x "$package/bin/wasmer"
          "$package/bin/wasmer" --version -v
          echo "$package/bin" >> "$GITHUB_PATH"
      - name: Record Wasmer revision and backends
        run: wasmer --version -v
      - name: Build LLGo and host-side GOROOT runner
        run: |
          go build -o "$RUNNER_TEMP/llgo" ./cmd/llgo
          go test -c -o "$RUNNER_TEMP/goroot-runner" ./test/goroot
      - name: Test WebAssembly runtime ABI with Go 1.24 and 1.27
        timeout-minutes: 15
        env:
          LLGO: ${{ runner.temp }}/llgo
        run: dev/test_wasm_runtime_go_versions.sh 1.24 1.27
      - name: Exercise representative runnable cases
        run: |
          set -o pipefail
          target_goroot="$(go env GOROOT)"
          status=0
          # These values are not test inputs and needlessly consume GoJS's
          # fixed 8 KiB argv-and-environment block.
          for name in $(compgen -e); do
            case "$name" in
              GITHUB_*|ACTIONS_*) unset "$name" ;;
            esac
          done
          for profile in J32-GoJS J32-Emscripten J64-Emscripten W32-WASI; do
            echo "::group::Exercise representative runnable cases ($profile)"
            if ! (
              cd test/goroot
              "$RUNNER_TEMP/goroot-runner" -test.v -test.run '^TestGoRootRunCases$' \
                -test.count=1 -test.timeout=10m \
                -goroot "$target_goroot" -llgo "$RUNNER_TEMP/llgo" \
                -wasm-profile "$profile" -directive-mode ci \
                -case '^(helloworld\.go|bom\.go)$' \
                -max-rss-mib 4096 -rss-warn-mib 1024 \
                -min-memory-free-percent 15 -min-swap-free-mib 512
            ) 2>&1 | tee "$RUNNER_TEMP/goroot-$profile.log"; then
              status=1
            fi
            echo "::endgroup::"
          done
          exit "$status"
      - name: Preserve sentinel logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: wasm-goroot-sentinels
          path: ${{ runner.temp }}/goroot-*.log
          if-no-files-found: error

  std-summary:
    name: Standard Library summary
    if: always()
    needs: [native, wasm-std, wasm-browser, wasm-sentinels]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.llgo_repository || 'xgo-dev/llgo' }}
          ref: ${{ env.LLGO_REF }}

      - name: Set up Go for the report generator
        uses: ./.github/actions/setup-go

      - name: Check out compatibility report checks
        uses: actions/checkout@v7
        with:
          path: compatibility-ci

      - name: Download native reports
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: std-native-stat-*
          path: native-reports
          merge-multiple: true

      - name: Download wasm acceptance reports
        continue-on-error: true
        uses: actions/download-artifact@v8
        with:
          pattern: wasm-acceptance-*
          path: wasm-reports
          merge-multiple: false

      - name: Generate standard library report
        id: report
        if: always()
        run: |
          report_md="$RUNNER_TEMP/std-report.md"
          coverage_md="$RUNNER_TEMP/std-coverage.md"
          coverage_ok=0
          if python3 compatibility-ci/scripts/check_report_coverage.py std \
            --native-reports native-reports --wasm-reports wasm-reports >"$coverage_md"; then
            coverage_ok=1
          fi
          # The detailed generator assumes complete reports. Use the summary
          # tables below for missing reports, without emitting a success claim.
          if [[ "$coverage_ok" == 1 && -d dev/stdreport ]]; then
            go run ./dev/stdreport \
              -native-reports native-reports \
              -wasm-reports wasm-reports \
              -run-url "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" \
              -mention-on-failure "fennoai" \
              -native-result "${{ needs.native.result }}" \
              -wasm-result "${{ needs.wasm-std.result }}" \
              -browser-result "${{ needs.wasm-browser.result }}" \
              -sentinels-result "${{ needs.wasm-sentinels.result }}" \
              -output "$report_md"
          else
            # Keep the workflow usable with LLGo revisions from before the
            # structured stdreport helper was added. The source under test is
            # still authoritative; this fallback only formats uploaded data.
            {
              echo '## Standard library compatibility summary'
              echo
              echo "[Workflow run]($GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID)"
              echo
              echo '| Suite | Result |'
              echo '|---|---|'
              echo '| Native compatibility and full std | ${{ needs.native.result }} |'
              echo '| WebAssembly std acceptance | ${{ needs.wasm-std.result }} |'
              echo '| Browser callback | ${{ needs.wasm-browser.result }} |'
              echo '| WebAssembly GOROOT sentinels | ${{ needs.wasm-sentinels.result }} |'
              echo
              echo '### Native shards'
              echo
              echo '| Platform | Lane | Go | Shard | Result |'
              echo '|---|---|---:|---:|---|'
              if [[ -d native-reports ]]; then
                find native-reports -type f -name 'summary-*.tsv' -exec cat {} + | sort | \
                  awk -F '\t' '{printf "| %s | %s | %s | %s/%s | %s |\n", $1, $2, $3, $4, $5, $6}'
              fi
              echo
              echo '### WebAssembly acceptance shards'
              echo
              echo '| Profile | Shard | Packages | Passed | Failed / unresolved |'
              echo '|---|---:|---:|---:|---:|'
              if [[ -d wasm-reports ]]; then
                while IFS= read -r report; do
                  jq -r '[.profile, ((.shard|tostring) + "/" + (.shards|tostring)), (.packages|length|tostring), ([.packages[] | select(.status == "pass")]|length|tostring), ([.packages[] | select(.status != "pass" and .status != "not-applicable" and .status != "separate-suite" and .status != "other-shard")]|length|tostring)] | "| " + join(" | ") + " |"' "$report"
                done < <(find wasm-reports -type f -name acceptance.json | sort)
              fi
              if [[ "${{ needs.native.result }}" != success || "${{ needs.wasm-std.result }}" != success || "${{ needs.wasm-browser.result }}" != success || "${{ needs.wasm-sentinels.result }}" != success ]]; then
                echo
                echo '> [!WARNING]'
                echo '> One or more compatibility suites failed. @fennoai please review the failed jobs.'
              fi
            } >"$report_md"
          fi

          cat "$coverage_md" "$report_md" >"$RUNNER_TEMP/std-report-with-coverage.md"
          mv "$RUNNER_TEMP/std-report-with-coverage.md" "$report_md"
          cat "$report_md" >>"$GITHUB_STEP_SUMMARY"
          echo "STD_REPORT=$report_md" >>"$GITHUB_ENV"
          echo "STD_COVERAGE_OK=$coverage_ok" >>"$GITHUB_ENV"

      - name: Preserve standard library summary report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: std-summary-report
          path: ${{ runner.temp }}/std-report.md
          if-no-files-found: error

      - name: Replace the daily STD report issue
        if: always() && steps.report.outcome == 'success' && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          report_date="$(TZ=Asia/Shanghai date +%F)"
          title="[STD daily] $report_date"
          gh issue list \
            --repo "$GITHUB_REPOSITORY" \
            --state open \
            --search 'in:title "[STD daily]"' \
            --limit 100 \
            --json number,title \
            --jq '.[] | select(.title | test("^\\[STD daily\\] [0-9]{4}-[0-9]{2}-[0-9]{2}$")) | .number' |
            while IFS= read -r issue_number; do
              gh issue close "$issue_number" --repo "$GITHUB_REPOSITORY"
            done
          gh issue create \
            --repo "$GITHUB_REPOSITORY" \
            --title "$title" \
            --body-file "$STD_REPORT"

      - name: Verify standard library matrix result
        if: always()
        run: |
          if [[ "$STD_COVERAGE_OK" != 1 ]]; then
            echo "error: incomplete standard library reports" >&2
            exit 1
          fi
          if [[ "${{ needs.native.result }}" != "success" || "${{ needs.wasm-std.result }}" != "success" || "${{ needs.wasm-browser.result }}" != "success" || "${{ needs.wasm-sentinels.result }}" != "success" ]]; then
            echo "error: one or more standard library jobs did not succeed" >&2
            exit 1
          fi
