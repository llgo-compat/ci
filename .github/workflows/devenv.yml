name: Development environments

on:
  pull_request:
    paths:
      - .github/workflows/devenv.yml
  workflow_dispatch:
    inputs:
      llgo_repository:
        description: LLGo repository to test
        required: true
        default: xgo-dev/llgo
        type: string
      llgo_ref:
        description: Branch, tag, or commit to test
        required: true
        default: main
        type: string
  schedule:
    - cron: "30 19 * * *"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  revision:
    name: Resolve LLGo revision
    # Set QINIU_LINUX_RUNNER to a JSON label array only after this repository
    # has access to the Qiniu runner group. Forks/defaults remain runnable.
    runs-on: ${{ fromJSON(vars.QINIU_LINUX_RUNNER || '["ubuntu-24.04"]') }}
    outputs:
      sha: ${{ steps.revision.outputs.sha }}
      linux_runner: ${{ vars.QINIU_LINUX_RUNNER || '["ubuntu-24.04"]' }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.llgo_repository || 'xgo-dev/llgo' }}
          ref: ${{ inputs.llgo_ref || 'main' }}
      - id: revision
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  mise:
    name: Mise (${{ matrix.os }})
    needs: revision
    runs-on: ${{ matrix.os == 'ubuntu-24.04' && fromJSON(needs.revision.outputs.linux_runner) || matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: llgo dev
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2025]
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.llgo_repository || 'xgo-dev/llgo' }}
          ref: ${{ needs.revision.outputs.sha }}
          path: llgo dev
      - uses: jdx/mise-action@f5be966e4a917d54244728e6a5fdcd1d93a35e6c # v5.2.6
        with:
          version: 2026.10.7
          install_args: --locked
          working_directory: llgo dev/dev
          env: true
          export_path: true
      - name: Build LLGo and check native dependencies
        if: runner.os != 'Windows'
        run: bash dev/check_devenv.sh
      - name: Build LLGo and check native dependencies (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: .\dev\check_devenv.ps1

  pixi:
    name: Pixi (${{ matrix.os }})
    needs: revision
    runs-on: ${{ matrix.os == 'ubuntu-24.04' && fromJSON(needs.revision.outputs.linux_runner) || matrix.os }}
    timeout-minutes: 30
    defaults:
      run:
        working-directory: llgo dev
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, ubuntu-24.04-arm, macos-15, macos-15-intel, windows-2025]
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.llgo_repository || 'xgo-dev/llgo' }}
          ref: ${{ needs.revision.outputs.sha }}
          path: llgo dev
      - uses: prefix-dev/setup-pixi@9936258fee697aff89b3fed6ca1f80a382ef694e # v0.11.3
        with:
          pixi-version: v0.81.0
          working-directory: llgo dev/dev
          locked: true
      - name: Check the development environment
        if: runner.os != 'Windows'
        run: pixi run --manifest-path dev/pixi.toml --locked bash dev/check_devenv.sh
      - name: Check the development environment (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: pixi run --manifest-path dev/pixi.toml --locked pwsh -File dev/check_devenv.ps1

  summary:
    name: Development environment summary
    needs: [revision, mise, pixi]
    if: always() && !cancelled()
    runs-on: ${{ fromJSON(needs.revision.outputs.linux_runner || '["ubuntu-24.04"]') }}
    env:
      MISE_RESULT: ${{ needs.mise.result }}
      PIXI_RESULT: ${{ needs.pixi.result }}
    steps:
      - name: Verify both host matrices
        run: |
          test "$MISE_RESULT" = success
          test "$PIXI_RESULT" = success
