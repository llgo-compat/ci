name: Compatibility regressions

on:
  workflow_call:
    inputs:
      llgo_repository:
        type: string
        default: xgo-dev/llgo
      llgo_ref:
        type: string
        required: true
      wasmer_release:
        type: boolean
        default: true
  workflow_dispatch:
    inputs:
      llgo_repository:
        description: LLGo repository to test
        type: string
        default: xgo-dev/llgo
      llgo_ref:
        description: LLGo branch, tag, or commit
        type: string
        default: main
      wasmer_release:
        description: Use the pinned LLGo Wasmer release
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

jobs:
  matrix:
    runs-on: ubuntu-24.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@v7
      - id: matrix
        run: echo "matrix=$(python3 scripts/compatibility_matrix.py regressions)" >> "$GITHUB_OUTPUT"

  regressions:
    name: Core (${{ matrix.platform }}, Go ${{ matrix.go_version }})
    needs: matrix
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          repository: ${{ inputs.llgo_repository }}
          ref: ${{ inputs.llgo_ref }}
      - uses: actions/checkout@v7
        with:
          path: compatibility-ci
      - uses: ./compatibility-ci/.github/actions/setup-macos-intel-llvm
        id: intel-llvm
        if: matrix.platform == 'darwin/amd64'
      - uses: ./.github/actions/setup-deps
        with:
          llvm-version: 22
          install-llvm: ${{ matrix.platform != 'darwin/amd64' }}
          windows-abi: ${{ matrix.windows_abi }}
          windows-arch: ${{ matrix.windows_arch }}
      - uses: ./.github/actions/setup-go
        with:
          architecture: ${{ matrix.windows_arch == 'arm64' && 'arm64' || '' }}
      - name: Build only the compiler and corpus runner
        id: build-tools
        shell: bash
        env:
          GOFLAGS: ${{ steps.intel-llvm.outputs.go-flags || env.GOFLAGS }}
          CGO_CPPFLAGS: ${{ steps.intel-llvm.outputs.cgo-cppflags || env.CGO_CPPFLAGS }}
          CGO_LDFLAGS: ${{ steps.intel-llvm.outputs.cgo-ldflags || env.CGO_LDFLAGS }}
        run: |
          mkdir -p "$RUNNER_TEMP/core-tools"
          suffix=
          if [[ "$RUNNER_OS" == Windows ]]; then suffix=.exe; fi
          go build -tags=llvm22,dev -o "$RUNNER_TEMP/core-tools/llgo$suffix" ./cmd/llgo
          go test -c -o "$RUNNER_TEMP/core-tools/goroot-runner$suffix" ./test/goroot
      - name: Resolve the target Go version
        id: target-go
        shell: bash
        run: |
          source dev/go_toolchain.sh
          echo "version=$(llgo_resolve_go_version "$PWD" '${{ matrix.go_version }}')" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-go
        with:
          go-version: ${{ steps.target-go.outputs.version }}
          architecture: ${{ matrix.windows_arch == 'arm64' && 'arm64' || '' }}
          cache: false
      - uses: ./.github/actions/activate-windows-target
        if: runner.os == 'Windows'
        with:
          windows-abi: ${{ matrix.windows_abi }}
          windows-arch: ${{ matrix.windows_arch }}
      - uses: emscripten-core/setup-emsdk@v15
        if: startsWith(matrix.wasm_profile, 'J')
        with:
          version: '6.0.8'
      - uses: actions/setup-node@v7
        if: startsWith(matrix.wasm_profile, 'J')
        with:
          node-version: '24'
      - uses: ./.github/actions/setup-binaryen
        if: startsWith(matrix.wasm_profile, 'J')
      - name: Install Wasmer
        if: matrix.wasm_profile == 'W32-WASI' && !inputs.wasmer_release
        run: bash dev/install_wasmer.sh
      - name: Install Wasmer llgo-v7.5.0.2
        if: matrix.wasm_profile == 'W32-WASI' && inputs.wasmer_release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          package="$RUNNER_TEMP/wasmer-llgo-v7.5.0.2"
          gh release download llgo-v7.5.0.2 --repo xgo-dev/wasmer \
            --pattern wasmer-linux-amd64.tar.gz --dir "$package"
          (
            cd "$package"
            echo '7878597d48f7e2435b8da1f43e11499fc3073dc0191a6c74c00c27f33849f179  wasmer-linux-amd64.tar.gz' | sha256sum --check
            tar -xzf wasmer-linux-amd64.tar.gz
            test "$(cat REVISION)" = "7692163d5f320ba0d475b2f848f36c1e1bcbdd57"
          )
          chmod +x "$package/bin/wasmer"
          echo "$package/bin" >> "$GITHUB_PATH"
      - name: Run the selected regressions
        id: regressions
        shell: bash
        env:
          CASES: ${{ matrix.cases }}
          WASM_PROFILE: ${{ matrix.wasm_profile }}
          EXPECTED_CASES: ${{ join(matrix.case_paths, ',') }}
        run: |
          export LLGO_ROOT="$PWD"
          suffix=
          if [[ "$RUNNER_OS" == Windows ]]; then
            suffix=.exe
            export LLGO_STDIO_NOBUF=1
          fi
          export LLGO_TEST_LLGO="$RUNNER_TEMP/core-tools/llgo$suffix"
          if [[ "$RUNNER_OS" == Windows ]]; then LLGO_TEST_LLGO=$(cygpath -w "$LLGO_TEST_LLGO"); fi
          work="$RUNNER_TEMP/core-work"
          mkdir -p "$work"
          if [[ "$RUNNER_OS" == Windows ]]; then work=$(cygpath -w "$work"); fi
          export TMPDIR="$work" TEMP="$work" TMP="$work"
          target_goroot=$(go env GOROOT)
          for name in $(compgen -e); do
            case "$name" in GITHUB_*|ACTIONS_*) unset "$name" ;; esac
          done
          min_swap_free_mib=512
          if [[ "$RUNNER_OS" == macOS ]]; then min_swap_free_mib=0; fi
          max_rss_mib=4096
          # Generated rangegen builds exceed 4 GiB on Intel macOS and Wasm.
          if [[ ",$EXPECTED_CASES," == *,rangegen.go,* ]]; then max_rss_mib=8192; fi
          (
            cd test/goroot
            "$RUNNER_TEMP/core-tools/goroot-runner$suffix" \
              -test.run='^TestGoRootRunCases$' -test.count=1 -test.v -test.timeout=20m \
              -goroot "$target_goroot" -directive-mode ci \
              -case "$CASES" -wasm-profile "$WASM_PROFILE" -min-swap-free-mib="$min_swap_free_mib" -keepwork \
              -max-rss-mib="$max_rss_mib" \
              2>&1 | tee "$RUNNER_TEMP/core-regressions.log"
          )
          python3 compatibility-ci/scripts/check_core_regressions.py \
            "$RUNNER_TEMP/core-regressions.log" --expected "$EXPECTED_CASES"
      - name: Check runtime C build modes
        if: always() && matrix.platform == 'linux/amd64' && steps.build-tools.outcome == 'success'
        env:
          LLGO_ROOT: ${{ github.workspace }}
        run: |
          modfile="$RUNNER_TEMP/core-runtime.mod"
          cp .github/test-go.mod "$modfile"
          cp .github/test-go.sum "${modfile%.mod}.sum"
          go mod edit -modfile="$modfile" -replace="github.com/xgo-dev/llgo/runtime=$PWD/runtime"
          LLGO="$RUNNER_TEMP/core-tools/llgo" LLGO_TEST_MODFILE="$modfile" \
            bash dev/test_std_buildmodes.sh ./test/std/runtime
      - name: Check the embedded runtime build tags
        if: always() && matrix.platform == 'linux/amd64' && steps.build-tools.outcome == 'success'
        env:
          LLGO_ROOT: ${{ github.workspace }}
        run: |
          "$RUNNER_TEMP/core-tools/llgo" build -target=esp32c3 \
            -o "$RUNNER_TEMP/core-esp32c3.elf" ./test/buildcache
      - uses: actions/upload-artifact@v7
        if: always() && steps.regressions.outcome != 'skipped'
        with:
          name: core-${{ matrix.artifact }}
          path: ${{ runner.temp }}/core-regressions.log
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: failure() && steps.regressions.outcome == 'failure'
        with:
          name: core-programs-${{ matrix.artifact }}
          path: |
            ${{ runner.temp }}/core-work/llgo-goroot-*/*.wasm
            ${{ runner.temp }}/core-work/llgo-goroot-*/*.mjs
            ${{ runner.temp }}/core-work/llgo-goroot-*/*.out
            ${{ runner.temp }}/core-work/llgo-goroot-*/go-work/*.go
            ${{ runner.temp }}/core-work/llgo-goroot-*/*generated-work/*.go
            ${{ runner.temp }}/core-work/llgo-goroot-*/wasm_fs.js
          retention-days: 3
          if-no-files-found: error
